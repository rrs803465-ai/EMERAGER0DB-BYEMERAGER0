[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emerager0db"
version = "0.1.0b0"
description = "Emerager0DB: a lightweight SQL database engine written in Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emerager0" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
Emerager0DB = "emerager0db.cli:main"

[tool.setuptools.packages.find]
include = ["emerager0db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
